name: CMake

# Only when the CMake build of the libraries changes; the AMBuild CI covers the rest
on:
  push:
    paths:
      - CMakeLists.txt
      - makefiles/cmake/**
      - .github/workflows/cmake.yml
  pull_request:
    paths:
      - CMakeLists.txt
      - makefiles/cmake/**
      - .github/workflows/cmake.yml

jobs:
  cmake:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
        build_type: [Release, Debug]
      fail-fast: false

    name: ${{ matrix.os }} - ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        name: Repository checkout
        with:
          submodules: recursive

      - name: Build the libraries and the checks
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DS2SDK_BUILD_TESTS=ON
          cmake --build build --config ${{ matrix.build_type }}
          ls -R build/lib

      - name: Test
        if: startsWith(runner.os, 'Linux')
        shell: bash
        run: |
          LD_LIBRARY_PATH=lib/linux64 build/keyvalues3_test
          LD_LIBRARY_PATH=lib/linux64 build/utliterators_test
          LD_LIBRARY_PATH=lib/linux64 build/utlsymbollarge_test
          LD_LIBRARY_PATH=lib/linux64 build/utlleanvector_test
          LD_LIBRARY_PATH=lib/linux64 build/bufferstring_test
          LD_LIBRARY_PATH=lib/linux64 build/cmdkeyvalues_test

